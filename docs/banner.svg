<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="t d">
  <title id="t">EzPzDPI</title>
  <desc id="d">EzPzDPI: проверка и обход блокировок на Windows</desc>
  <style>
    text { font-family: "Unbounded", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .sub { font-family: "Onest", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  </style>
  <defs>
    <pattern id="stripe" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#f0a800"/>
      <rect width="6" height="12" fill="#14202b"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="720" height="180" rx="18" fill="#eef2f3"/>
  <!-- route board in miniature: a line hops over the ISP barrier -->
  <g transform="translate(36 40)">
    <line x1="4" y1="0" x2="4" y2="100" stroke="#14202b" stroke-width="4"/>
    <rect x="62" y="0" width="16" height="100" fill="url(#stripe)"/>
    <path d="M4 78 H44 C54 78 54 44 70 44 C86 44 86 78 96 78 H122" fill="none" stroke="#f0a800" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="122" cy="78" r="8" fill="#f0a800" stroke="#14202b" stroke-width="2"/>
    <path d="M4 28 H40" stroke="#d2372b" stroke-width="5" stroke-linecap="round"/>
    <path d="M44 22 l10 12 M54 22 l-10 12" stroke="#d2372b" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="190" y="102" font-size="56" font-weight="700" fill="#14202b" letter-spacing="-1">EzPzDPI</text>
  <text class="sub" x="192" y="138" font-size="17.5" fill="#586775">Проверка и обход блокировок на Windows в одно нажатие</text>
</svg>
